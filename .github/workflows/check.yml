name: check
on:
  pull_request:
  push:
    branches: [main]
    tags: ['ui-*']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # No npm install and no cache: every script uses only node's own modules.
      - run: node tools/check.js
      - if: startsWith(github.ref, 'refs/tags/ui-')
        run: node tools/check.js --only release --release "$GITHUB_REF_NAME"
