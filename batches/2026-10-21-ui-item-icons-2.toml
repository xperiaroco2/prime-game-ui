# prime-game#150, the UI track's sticker-glow wave: round 1's item icons (batch 2026-10-21-ui-item-icons) read as
# generic AI art (airbrushed gradients, glossy plastic, rim-light halos, stock-photo food, clip-art line). Two new
# treatments, one 3x2 sheet of the same six MVP carried items each, n = 3: a die-cut sticker illustration that belongs
# to the sticker UI, and the vinyl toy reworked (real proportions, matte, one key light, no halos). Under the engineer's
# $3 approval of 2026-10-21 (round 1 spent $0.10 of it). No game names in prompts.
# Schema: D:/prime-game-art/docs/openai-images.md.

id = "2026-10-21-ui-item-icons-2"
service = "openai-images"
purpose = "prime-game#150: two new item icon treatments (die-cut sticker, reworked vinyl toy) for the sticker UI, one 3x2 sheet of the six MVP carried items per treatment, after round 1 read as generic AI art."
plan = "OpenAI API, prepaid balance (topped up by the engineer, 2026-10-20)"
terms_url = "https://openai.com/policies/services-agreement/"
licence = "owned by the customer: OpenAI assigns to the customer all its rights in the Output (OpenAI Services Agreement, section 4.1, read 2026-10-20); no attribution required"
cost_cap_usd = 2.5
approved_by = "xperiaroco2 (the engineer)"
approved_at = "2026-10-21"
approval_ref = "https://github.com/xperiaroco2/prime-game/issues/150#issuecomment-6315845671"
model = "gpt-image-2.5-sunburst"
quality = "medium"

[defaults]
size = "1536x1024"
n = 3
background = "transparent"

[variants.sticker]
prompt = "A 3 by 2 grid of 6 equal cells on a 1536x1024 canvas, one object per cell, each a die-cut vinyl sticker of the object for a stylish grown-up party game's interface. Style frame: hand-inked indie sticker art, the kind an illustrator sells at a zine fair, drawn by a confident human hand: a bold near-black purple ink outline (#1E1230) with varying line weight, thick on the outer silhouette and on the shadow side, thinner for the few inner lines, line ends slightly tapered, a little irregular like a real brush pen; flat cel shading, every colour as 2 or 3 flat tones with hard edges (base, one shadow shape, one small hard highlight shape), shadows on the lower right because the light is from the upper left. Around the whole silhouette a clean, even, solid white die-cut border about 3 percent of the cell wide, its outer edge smooth and simplified, then nothing. Proportions: slightly simplified and a little chunky but true to the real object, adult and matter-of-fact, never cute, never bubbly, no face. COLOUR: a limited muted palette, saturation held down: soft mint #CFF3DF, coral #FF8A6B, deep purple #2B1846, warm cream #F3E6CC, plus each object's own real colour pulled slightly toward that palette. CAMERA: three-quarter view from slightly above, the same angle and scale in every cell, the sticker filling about 80 percent of its cell and centred, each cell clearly separated. BACKGROUND: fully transparent around the white border. EXCLUDE: gradients, airbrush, soft shading, gloss, shine, specular hotspots, glow, halos, drop shadows, texture, grain, halftone, hatching, sparkles, photorealism, 3D render look, clip-art stock-vector look, text, letters, numbers, logos, labels, hands, faces, eyes, characters, grid lines, cell borders, checkerboard, scenery. Cell 1 (top left): a burger, drawn as a few big confident shapes: a domed bun with five or six sesame seeds as simple cream dashes, one thick dark patty, a slab of cheese drooping over one corner, a frilly lettuce edge and one tomato slice, the stack slightly uneven. Cell 2 (top middle): a wrench, a long steel combination spanner, open end and ring end, cool grey metal with one long hard white highlight streak along the shaft, crisp straight edges, lying diagonally. Cell 3 (top right): a watering can, a painted metal garden watering can in muted teal-mint with a long straight spout and a rose head, a top handle, one small dent. Cell 4 (bottom left): a battery, a large chunky cylindrical cell standing upright, plain unmarked coral casing with a deep purple band at the base, a raised silver terminal on top. Cell 5 (bottom middle): a flower in a pot, one tall red tulip with two long blade-shaped leaves in a plain cream ceramic pot with a simple rim, a grown-up houseplant. Cell 6 (bottom right): a printed car part, a compact alien engine part of strange asymmetric design (a ribbed organic intake housing with three lobes, one round port and a flange with bolt holes), unpainted off-white printed plastic shown with a few thin parallel ink lines for the print layers."

[variants.vinyl]
prompt = "A 3 by 2 grid of 6 equal cells on a 1536x1024 canvas, one object per cell, each object an inventory icon for a stylish grown-up party game. Style frame: a hand-sculpted designer collectible figure of the object, the same soft-matte finish as the game's alien characters (smooth satin vinyl and matte paint, no shine), but with proportions close to the real object: not inflated, not puffy, not rounded off; flat faces stay flat, metal parts have crisp, sharp, bevelled edges, soft parts (bread, leaves, rubber) are softly rounded. The shading is simple and graphic, like a stylised game prop: a few clear value steps across each form, the planes of the object easy to read, small sculpted details kept few and deliberate. LIGHT: one single soft key light from the upper left, a darker shadow side on the lower right, soft contact occlusion only inside creases; no rim light, no back light, no coloured edge light, no glow, no halo around the object, no cast shadow, no floor. MATERIAL: matte; at most one small soft highlight on a metal part; no glossy plastic sheen, no wet look, no airbrushed gradients. COLOUR: a muted palette taken from the aliens' skin and lips: mint #9FD9C4, teal #3E8C8A, coral #E9745E, cream #F3E6CC, deep purple #2B1846, plus each object's own real colour, saturation held down, every object reading as its real self. CAMERA: three-quarter view from slightly above (about 30 degrees), long-lens orthographic look, the same angle and scale in every cell, the object filling about 80 percent of its cell and centred. BACKGROUND: fully transparent, the object cleanly cut out with a crisp edge and no fringe, nothing else in the cell. EXCLUDE: text, letters, numbers, logos, labels, characters, hands, faces, eyes, cute features, sparkles, glitter, glow, halos, rim lights, reflections, gloss, candy colours, pastel baby colours, photorealism, stock-photo food styling, ground plane, checkerboard, borders, grid lines, scenery. Cell 1 (top left): a burger, a real-proportioned cheeseburger: a slightly flattened matte bun with a few sculpted sesame seeds, one thick dark grilled patty, a slice of cheese folding over one side, a ruffled lettuce edge and a tomato slice, slightly uneven like a real burger, not a perfect stock burger. Cell 2 (top middle): a wrench, a long steel combination spanner, open end and ring end, slim and flat like a real tool, satin grey metal with crisp bevelled edges, lying diagonally. Cell 3 (top right): a watering can, a painted metal garden watering can in muted teal with a long straight spout and a rose head, a top handle, real thin sheet-metal proportions. Cell 4 (bottom left): a battery, a large cylindrical cell standing upright, plain unmarked coral casing with a deep purple base band, a crisp satin metal terminal on top. Cell 5 (bottom middle): a flower in a pot, one tall red tulip with two long blade-shaped leaves in a plain cream ceramic pot with a simple rim. Cell 6 (bottom right): a printed car part, a compact alien engine part of strange asymmetric design (a ribbed organic intake housing with three lobes, one round port and a flange with bolt holes), unpainted matte off-white 3D-printed plastic with fine visible layer lines, crisp edges."

[[items]]
id = "sticker1"
variant = "sticker"
kind = "generate"

[[items]]
id = "vinyl1"
variant = "vinyl"
kind = "generate"

# Round 2, edits of the best sheet per treatment. sticker1 came back as a stock "AI sticker" (soft gradients on the
# battery, bun and can, a thin even line, a full field of sesame seeds, an earthly intake manifold for the alien part,
# a sparkle on the can). vinyl1 drifted to photo-real props (grilled meat grain, bread pores, pitted forged steel,
# soil grains). The edits keep the layout and push each look home.
[[items]]
id = "sticker2"
kind = "edit"
images = [{ from = "sticker1", pick = 1 }]
prompt = "Redraw this sheet of six die-cut stickers: the same six objects in the same cells, the same angles and the same clean white die-cut border around each, but as truly flat hand-inked sticker art by a confident human illustrator, not generic clip art. LINE: the near-black purple ink outline (#1E1230) twice as thick as in the reference on the outer silhouette, clearly varying in weight like a brush pen (heavier on the lower right shadow side, thinner on the lit upper left), inner lines few and thinner. SHADING: every colour exactly 2 or 3 flat tones with hard edges, one flat shadow shape on the lower right and one small hard highlight shape on the upper left; remove every soft gradient (the battery body, the bun, the can, the wrench, the pot must be flat fills), no airbrush, no texture, no fine grain, no noise. Per object: the burger with only five sesame seeds as simple cream dashes, the lettuce as one bold wavy band, the patty one flat dark shape with two or three ink ticks; the wrench flat cool greys with one long hard white streak; the watering can with no sparkle mark, just one small dent drawn as an ink tick; the battery flat coral with one hard shadow band and the purple base band; the tulip unchanged in idea, flat tones; the printed car part redesigned as a clearly alien engine part, not a human intake manifold: an asymmetric organic shell like a ribbed seed pod or a beetle carapace, three bulbous lobes of different sizes fused onto a small square bolted flange with one round port, unpainted off-white with three or four thin parallel ink lines for the print layers and no fine texture. COLOUR: muted, saturation held down, mint #CFF3DF, coral #FF8A6B, deep purple #2B1846, cream #F3E6CC plus each object's own colour. BACKGROUND: fully transparent around the white borders. EXCLUDE: gradients, gloss, glow, halos, drop shadows, sparkles, texture, halftone, hatching, text, letters, numbers, logos, hands, faces, eyes, grid lines, cell borders, checkerboard."

[[items]]
id = "vinyl2"
kind = "edit"
images = [{ from = "vinyl1", pick = 0 }]
prompt = "Restyle this sheet of six objects: the same six objects in the same cells, the same angles and real-object proportions, but as stylised hand-sculpted designer vinyl toys, clearly not photographs. SURFACES: every surface smooth, clean and evenly matte like satin vinyl and matte paint, with no surface texture at all: no grilled meat grain, no bread pores, no pitted or brushed metal, no soil grains, no print noise. FORMS: simplified into clean sculpted shapes with a few deliberate sculpted details; flat faces stay flat, metal parts have crisp bevelled edges, soft parts softly rounded, nothing inflated or puffy. Per object: the burger with about eight big sculpted sesame seeds, the patty a smooth dark sculpted slab with three soft grill ridges, the lettuce a few broad smooth ruffles, the cheese one smooth folded slice; the wrench smooth satin grey with crisp bevels; the watering can smooth matte teal paint; the battery smooth matte coral with the purple base band and a crisp satin terminal; the tulip and leaves smooth and sculpted, the soil a smooth dark disc; the printed car part redesigned as a clearly alien engine part, not a human intake manifold: an asymmetric organic shell like a ribbed seed pod, three bulbous lobes of different sizes fused onto a small square bolted flange with one round port, smooth matte off-white with fine even layer lines. LIGHT: one soft key light from the upper left, a darker shadow side on the lower right, soft occlusion only in creases; no rim light, no coloured light, no glow, no halo, no cast shadow, no floor. COLOUR: muted, from the aliens' skin and lips: mint #9FD9C4, teal #3E8C8A, coral #E9745E, cream #F3E6CC, deep purple #2B1846, plus each object's own colour. BACKGROUND: fully transparent, each object cleanly cut out with a crisp edge, nothing else in the cell. EXCLUDE: photorealism, stock-photo food, gloss, wet look, sparkles, glow, halos, text, letters, numbers, logos, hands, faces, eyes, cute features, grid lines, borders, checkerboard."
