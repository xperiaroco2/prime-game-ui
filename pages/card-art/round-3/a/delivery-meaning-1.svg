    <path class="k t" d="M213 160V151Q213 147 217 147H226Q230 147 230 151V160"/>
    <rect class="w" x="235" y="151" width="9" height="10" rx="2" style="stroke-width:4"/>
    <path class="w" d="M210 160H244Q248 160 248 164V212H206V164Q206 160 210 160Z"/>
    <path class="i" d="M227 172C222 180 219 185 219 189A8 8 0 0 0 235 189C235 185 232 180 227 172Z"/>
