    <path class="k t dd" d="M211 124C207 106 208 94 213 84M245 124C249 106 248 94 243 84M205 79H251L228 42Z"/>
    <path class="w" d="M258 112V96Q258 90 263 88V78H269V88Q274 90 274 96V112Z"/>
