    <path class="w" d="M276 202C267 188 268 168 272 156H280C284 168 285 188 276 202Z" style="stroke-width:4"/>
    <path class="k f" d="M270 176h12"/>
    <!-- yank lines -->
    <path class="k t" d="M178 92h10M176 105h14M178 118h10"/>
    <!-- figure, leaning back with the weight, the gnome hugged to the chest -->
    <path class="k" d="M106 152L80 211M106 152L126 181L136 211"/>
    <path class="k" d="M106 152L97 104"/>
    <use href="#m1-g" transform="translate(148 150) scale(.8)"/>
    <path class="k" d="M99 114L139 120M99 118Q106 142 139 140"/>
    <circle class="w" cx="91" cy="84" r="19"/>
    <circle class="i" cx="97" cy="81" r="2.8"/><circle class="i" cx="105" cy="81" r="2.8"/>
    <path class="k t" d="M94 92q3-3 5 0t5 0"/>
    <!-- effort -->
    <path d="M62 64q-6 8 0 10q6-2 0-10z" fill="#fff" stroke="#1f2433" stroke-width="3" stroke-linejoin="round"/>
    <path class="k t" d="M80 56l-3-7M93 53l1-8"/>
