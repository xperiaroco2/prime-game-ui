<!-- own work, prime-game-ui, licence: own work -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <filter id="ca1-w" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="240">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .k{fill:none;stroke:#1f2433;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .t{stroke-width:4}
      .f{stroke-width:3}
      .w{fill:#fff;stroke:#1f2433;stroke-width:5;stroke-linejoin:round}
      .a{fill:#FFD60A;stroke:#1f2433;stroke-width:5;stroke-linejoin:round}
      .i{fill:#1f2433}
      .o{fill:none;stroke:#FFD60A;stroke-width:5;stroke-linecap:round}
    </style>
    <!-- the spoiler, the car part of this card, its struts' feet at 0,0; its colour comes from the use -->
    <g id="ca1-sp">
      <rect x="-13" y="-16" width="5" height="16" rx="1.5"/>
      <rect x="8" y="-16" width="5" height="16" rx="1.5"/>
      <path d="M-24 -19Q-26 -27 -19 -28L20 -31Q26 -31 25 -24L24 -19Q23 -14 18 -14H-19Q-23 -14 -24 -19Z"/>
    </g>
    <!-- the car, side view facing right, the wheels standing on 0: body, two windows, a door seam, two wheels -->
    <g id="ca1-car">
      <path class="w" d="M-62 -16V-34Q-62 -40 -56 -40H-30L-16 -60Q-13 -64 -8 -64H18Q24 -64 28 -59L40 -42L58 -38Q66 -36 66 -28V-17Q66 -12 61 -12H-58Q-62 -12 -62 -16Z"/>
      <path class="w" d="M-24 -42L-12 -58H1V-42Z" style="stroke-width:4"/>
      <path class="w" d="M8 -42V-58H17Q20 -58 22 -55L31 -42Z" style="stroke-width:4"/>
      <path class="k f" d="M4 -38V-18"/>
      <circle class="w" cx="-36" cy="-14" r="14"/>
      <circle class="i" cx="-36" cy="-14" r="5"/>
      <circle class="w" cx="38" cy="-14" r="14"/>
      <circle class="i" cx="38" cy="-14" r="5"/>
    </g>
  </defs>
  <g filter="url(#ca1-w)">
    <ellipse cx="262" cy="213" rx="26" ry="4" fill="#1f2433" opacity=".12"/>
    <path class="k t" d="M16 212C96 209 210 214 304 211"/>
    <!-- the garage's order board: this order's card big (the car with an amber spoiler), a second order small (dark rims) -->
    <rect class="w" x="18" y="22" width="196" height="172" rx="6"/>
    <circle class="i" cx="29" cy="33" r="3.5"/><circle class="i" cx="203" cy="33" r="3.5"/><circle class="i" cx="29" cy="183" r="3.5"/><circle class="i" cx="203" cy="183" r="3.5"/>
    <g transform="translate(176 140) rotate(5)">
      <rect class="w" x="-22" y="-4" width="44" height="40" rx="4" style="stroke-width:4"/>
      <circle class="i" cx="0" cy="16" r="12"/>
      <circle cx="0" cy="16" r="4" fill="#fff"/>
    </g>
    <g transform="translate(100 44) rotate(-2)">
      <rect class="w" x="-72" y="0" width="144" height="108" rx="6"/>
      <rect class="i" x="-11" y="-9" width="22" height="16" rx="3"/>
      <g transform="translate(6 94) scale(.88)">
        <use href="#ca1-car"/>
      </g>
      <g transform="translate(-34.5 59) scale(.88)">
        <use href="#ca1-sp" class="a" style="stroke-width:4.5"/>
      </g>
    </g>
    <!-- figure, turned to the board, studying the order, a hand at the chin -->
    <path class="k" d="M262 152L246 211M262 152L278 211"/>
    <path class="k" d="M262 152L260 104"/>
    <path class="k" d="M260 116L236 134L240 104"/>
    <path class="k" d="M261 118L276 146"/>
    <circle class="w" cx="256" cy="84" r="19"/>
    <circle class="i" cx="248" cy="77" r="2.8"/><circle class="i" cx="240" cy="77" r="2.8"/>
    <path class="k t" d="M242 92l9-2"/>
  </g>
</svg>
