<!-- own work, prime-game-ui, licence: own work -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <filter id="kb2-w" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="240">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .k{fill:none;stroke:#1f2433;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .t{stroke-width:4}
      .f{stroke-width:3}
      .w{fill:#fff;stroke:#1f2433;stroke-width:5;stroke-linejoin:round}
      .a{fill:#e8a33a;stroke:#1f2433;stroke-width:5;stroke-linejoin:round}
      .i{fill:#1f2433}
      .o{fill:none;stroke:#e8a33a;stroke-width:5;stroke-linecap:round}
      .d{fill:none;stroke:#1f2433;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 7}
    </style>
    <!-- the order's herb icons, centre 0,0, about 16 wide: the star (the one this order wants, amber), the moon, the drop -->
    <polygon id="kb2-st" class="a" points="0,-9 2.35,-3.24 8.56,-2.78 3.8,1.24 5.29,7.28 0,4 -5.29,7.28 -3.8,1.24 -8.56,-2.78 -2.35,-3.24" style="stroke-width:3"/>
    <g id="kb2-mo"><circle class="i" r="8"/><circle cx="4.5" cy="-2.5" r="6.5" fill="#fff"/></g>
    <path id="kb2-dr" class="i" d="M0 -8C-4 -2 -6 1 -6 3A6 6 0 0 0 6 3C6 1 4 -2 0 -8Z"/>
    <!-- a greenhouse flower head, centre 0,0: five petals, a disc that carries the round's icon -->
    <g id="kb2-fl">
      <g fill="#fff" stroke="#1f2433" stroke-width="3.5" stroke-linejoin="round"><circle cx="0" cy="-11" r="8"/><circle cx="10.46" cy="-3.4" r="8"/><circle cx="6.47" cy="8.9" r="8"/><circle cx="-6.47" cy="8.9" r="8"/><circle cx="-10.46" cy="-3.4" r="8"/></g>
      <g fill="#fff"><circle cx="0" cy="-11" r="8"/><circle cx="10.46" cy="-3.4" r="8"/><circle cx="6.47" cy="8.9" r="8"/><circle cx="-6.47" cy="8.9" r="8"/><circle cx="-10.46" cy="-3.4" r="8"/></g>
      <circle class="w" r="10" style="stroke-width:3"/>
    </g>
  </defs>
  <g filter="url(#kb2-w)">
    <ellipse cx="80" cy="213" rx="26" ry="4" fill="#1f2433" opacity=".12"/>
    <path class="k t" d="M16 212C96 209 210 214 304 211"/>
    <!-- the bed: a moon flower, the stub of the picked one, a drop flower -->
    <path class="k f" d="M188 200V136M278 200V128M188 176q-7-1-9-8M278 168q7-1 9-8"/>
    <path class="k f" d="M232 200v-9M232 194l-5-4M232 194l5-4"/>
    <path class="w" d="M152 212C162 186 296 186 304 212Z" style="stroke-width:4"/>
    <g transform="translate(188 126) scale(1.25)">
      <use href="#kb2-fl"/>
    </g>
    <g transform="translate(188 126) scale(.95)">
      <use href="#kb2-mo"/>
    </g>
    <g transform="translate(278 118) scale(1.25)">
      <use href="#kb2-fl"/>
    </g>
    <g transform="translate(278 118) scale(.95)">
      <use href="#kb2-dr"/>
    </g>
    <!-- the thought: the order's icon -->
    <circle class="w" cx="68" cy="52" r="3" style="stroke-width:3"/>
    <circle class="w" cx="58" cy="40" r="5" style="stroke-width:3.5"/>
    <circle class="w" cx="36" cy="30" r="16" style="stroke-width:4"/>
    <use href="#kb2-st" transform="translate(36 30)"/>
    <!-- figure, the star flower just picked, held up to look at -->
    <path class="k" d="M80 152L64 211M80 152L96 211"/>
    <path class="k" d="M80 152L82 104"/>
    <path class="k" d="M82 118L72 148"/>
    <path class="k f" d="M124 106L134 60M129 86q7-1 9-8"/>
    <path class="k" d="M83 114L124 106"/>
    <g transform="translate(136 50) scale(1.25)">
      <use href="#kb2-fl"/>
    </g>
    <use href="#kb2-st" transform="translate(136 50) scale(1.05)"/>
    <circle class="w" cx="86" cy="84" r="19"/>
    <circle class="i" cx="94" cy="78" r="2.8"/><circle class="i" cx="102" cy="78" r="2.8"/>
    <path class="k t" d="M92 92q5 4 10 0"/>
  </g>
</svg>
