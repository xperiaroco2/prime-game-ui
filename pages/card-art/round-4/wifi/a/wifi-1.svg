      <path d="M-11 0A11 10 0 0 1 11 0Z"/>
      <path d="M-6 0Q-9 6 -6 11M0 0V12M6 0Q9 6 6 11"/>
    </g>
    <!-- a phone receiver, centred on 0,0, upright, the cups toward +x -->
    <path id="wa1-rc" class="i" d="M-3 -24H3Q9 -24 9 -18V-13Q9 -10 5 -10H2V10H5Q9 10 9 13V18Q9 24 3 24H-3Q-8 24 -8 18V-18Q-8 -24 -3 -24Z"/>
    <!-- the house phone on the wall, its cord leaving at 0,18; an empty hook on top (the receiver is in a hand) -->
    <g id="wa1-ph">
