      .i{fill:#1f2433}
      .o{fill:none;stroke:#FFD60A;stroke-width:5;stroke-linecap:round}
    </style>
    <!-- the alien glyphs (the card's own; the game's glyphs are not drawn yet), centred on 0,0, about 26 across. The one this card follows: the snail with horns -->
    <g id="wa1-gs" class="k t">
      <path d="M1.8 3L1.6 2.2L2.1 1.2L3.2 0.6L4.7 0.7L6 1.7L6.6 3.6L6.1 5.7L4.4 7.3L1.8 7.8L-0.8 6.8L-2.6 4.3L-2.9 1.1L-1.3 -2L1.9 -3.9L5.8 -3.9L9.3 -1.6L11.2 2.4L10.7 6.9L7.7 10.7L3 12.5H-6Q-13 12.5 -13 5"/>
