    <rect class="w" x="166.5" y="90.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="182.5" y="90.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="150.5" y="100.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="166.5" y="100.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="182.5" y="100.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="150.5" y="110.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="166.5" y="110.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="182.5" y="110.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
    <rect class="w" x="166.5" y="120.5" width="11" height="7" rx="2.5" style="stroke-width:3"/>
