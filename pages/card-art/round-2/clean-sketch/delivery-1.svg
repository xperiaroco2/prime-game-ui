    <rect class="w" x="252" y="72" width="40" height="28" rx="3"/><path class="k t" d="M272 72v9"/>
    <rect class="k t dd" x="210" y="117" width="48" height="39" rx="3"/>
    <rect class="w" x="264" y="122" width="30" height="34" rx="3"/><path class="k t" d="M279 122v9"/>
    <rect class="w" x="206" y="170" width="44" height="42" rx="3"/><path class="k t" d="M228 170v10"/>
    <rect class="w" x="256" y="180" width="38" height="32" rx="3"/><path class="k t" d="M275 180v9"/>
    <!-- yank lines -->
    <path class="k t" d="M186 112h12M184 125h16M186 138h12"/>
