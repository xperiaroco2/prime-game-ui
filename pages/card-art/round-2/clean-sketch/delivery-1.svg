    <path class="k" d="M99 114L129 116M99 117Q108 140 129 136"/>
    <circle class="w" cx="91" cy="84" r="19"/>
    <circle class="i" cx="97" cy="81" r="2.8"/><circle class="i" cx="105" cy="81" r="2.8"/>
    <path class="k t" d="M94 92q3-3 5 0t5 0"/>
