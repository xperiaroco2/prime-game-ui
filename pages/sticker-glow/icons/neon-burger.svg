<g id="L"><path d="M12 28C12 19 19 13 30 13C32.5 13 34.8 13.3 36.8 13.8A5 5 0 0 0 43 21A5 5 0 0 0 50.3 23.2Q51.6 25.4 52 28Z"/><path d="M12 41.5H52"/><path d="M12 47H52V49Q52 54 47 54H17Q12 54 12 49Z"/><path d="M21 21.5l2.5-1.2M30 18.5h2.8"/></g>
<g id="A"><path d="M11 34.5q2.5-3 5 0t5 0t5 0t5 0t5 0t5 0t5 0t5 0"/></g>
